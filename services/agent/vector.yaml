# Ships the agent container's stdout/stderr to Better Stack.
# BETTER_STACK_SOURCE_TOKEN and BETTER_STACK_INGESTING_HOST come from the server's .env.
sources:
  agent:
    type: docker_logs
    include_containers: ["octra-agent"]

sinks:
  better_stack:
    type: http
    inputs: ["agent"]
    uri: "https://${BETTER_STACK_INGESTING_HOST}/"
    method: post
    encoding:
      codec: json
    compression: gzip
    auth:
      strategy: bearer
      token: "${BETTER_STACK_SOURCE_TOKEN}"
